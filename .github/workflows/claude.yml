name: Claude

# Claude investigates and fixes issues when the maintainer asks.
# Comment "@claude please fix this" on an issue. Claude commits a fix to a new branch and
# replies with a link to open a pull request, which the maintainer reviews before merging.
# Only users with write access to this repository can trigger it (enforced by the action).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The Android SDK is preinstalled on GitHub's Ubuntu runners; Gradle needs JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Repository secret from running `claude setup-token` with a Claude Pro/Max account
          # (Settings › Secrets and variables › Actions). To use an API key instead, replace this
          # line with `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`; don't set both.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(./gradlew:*),Bash(chmod +x gradlew),Bash(git:*)"
